/* ─── LOGO ─── */
function Logo({width=150, color="white", textColor="white"}) {
  // Viewbox: 220 wide x 56 tall — icon (56x56) + text
  // The "A": bold geometric, wide base, pointed apex, crossbar implied by aircraft slash
  // Two aircraft cross diagonally through the A — upper-right direction + lower-left direction
  const a = color; // letter color
  const p = color === "white" ? "rgba(255,255,255,0.72)" : "rgba(0,0,0,0.55)"; // aircraft color (slightly dimmer)
  return (
    <svg width={width} height={Math.round(width * 56/220)} viewBox="0 0 220 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      {/* ── THE A ── bold geometric, wide serif-style */}
      {/* Left leg */}
      <polygon points="4,52 16,52 28,6 20,6" fill={a}/>
      {/* Right leg */}
      <polygon points="52,52 40,52 28,6 36,6" fill={a}/>
      {/* Left crossbar fill (below slash) */}
      <polygon points="13,38 20,38 24,26 17,26" fill={a}/>
      {/* Right crossbar fill (above slash) */}
      <polygon points="38,26 43,26 39,38 32,38" fill={a}/>

      {/* ── AIRCRAFT 1 — crosses upper-left to upper-right, angled ~−22deg ── */}
      {/* Fuselage */}
      <g transform="rotate(-22, 28, 22)">
        {/* Body */}
        <rect x="8" y="20.5" width="40" height="3" rx="1.5" fill={p}/>
        {/* Nose cone */}
        <polygon points="48,20.5 56,22 48,23.5" fill={p}/>
        {/* Swept wings */}
        <polygon points="26,21 36,21 32,14 24,18" fill={p}/>
        <polygon points="26,23 36,23 32,30 24,26" fill={p}/>
        {/* Tail fin vertical */}
        <polygon points="12,21.5 12,20 8,16 8,21.5" fill={p}/>
        {/* Tail stabilizers */}
        <polygon points="10,21 18,21 16,17 10,19" fill={p}/>
        <polygon points="10,23 18,23 16,27 10,25" fill={p}/>
      </g>

      {/* ── AIRCRAFT 2 — crosses lower-right to lower-left, angled ~+18deg, offset down ── */}
      <g transform="rotate(18, 28, 36)">
        {/* Body */}
        <rect x="6" y="34.5" width="36" height="2.5" rx="1.2" fill={p} opacity="0.85"/>
        {/* Nose */}
        <polygon points="42,34.5 49,35.7 42,37" fill={p} opacity="0.85"/>
        {/* Wings */}
        <polygon points="23,35 31,35 28,29 22,32" fill={p} opacity="0.85"/>
        <polygon points="23,36.5 31,36.5 28,42 22,39" fill={p} opacity="0.85"/>
        {/* Tail fin */}
        <polygon points="9,35 9,33.5 6,30 6,35" fill={p} opacity="0.85"/>
        {/* Tail stabs */}
        <polygon points="8,34.5 15,34.5 13,31 8,33" fill={p} opacity="0.85"/>
        <polygon points="8,36 15,36 13,39.5 8,37.5" fill={p} opacity="0.85"/>
      </g>

      {/* ── AIRSELL TEXT ── wide-tracked condensed caps */}
      <text
        x="68" y="40"
        fontFamily="'Barlow Condensed', 'Arial Narrow', Impact, sans-serif"
        fontSize="26"
        fontWeight="500"
        fill={textColor}
        letterSpacing="5"
      >AIRSELL</text>
    </svg>
  );
}

/* ─── SHARED BUTTONS ─── */
const Btn = ({children, onClick, style={}, variant="gold", full=false, disabled=false}) => {
  const base = {
    border:"none", borderRadius:"2px", cursor: disabled ? "not-allowed" : "pointer",
    fontFamily:"'Barlow Condensed',sans-serif", fontSize:"0.82rem", fontWeight:700,
    letterSpacing:"0.1em", textTransform:"uppercase", transition:"opacity 0.15s",
    width: full ? "100%" : undefined, opacity: disabled ? 0.5 : 1,
    padding:"0.6rem 1.25rem",
  };
  const variants = {
    gold: {background:C.gold, color:C.darker},
    outline: {background:"transparent", color:C.white, border:`1px solid rgba(255,255,255,0.15)`},
    goldOutline: {background:"transparent", color:C.gold, border:`1px solid ${C.gold}50`},
    danger: {background:"transparent", color:"#C87E7E", border:"1px solid rgba(200,126,126,0.25)"},
    ghost: {background:"transparent", color:C.mid, border:`1px solid ${C.borderFaint}`},
  };
  return <button style={{...base,...variants[variant],...style}} onClick={onClick} disabled={disabled}>{children}</button>;
};

/* ═══════════════════════════════════════════
   MAIN APP
═══════════════════════════════════════════ */
export default function App() {
  const [page, setPage] = useState("listing"); // listing | manage
  const [photos, setPhotos] = useState([]);
  const [photosLoaded, setPhotosLoaded] = useState(false);
  const [notification, setNotification] = useState(null);

  useEffect(() => { loadPhotos(); }, []);

  async function loadPhotos() {
    try {
      const res = await window.storage.get(PHOTO_KEY);
      if (res?.value) setPhotos(JSON.parse(res.value));
    } catch {}
    setPhotosLoaded(true);
  }

  async function savePhotos(updated) {
    setPhotos(updated);
    try { await window.storage.set(PHOTO_KEY, JSON.stringify(updated)); }
    catch { notify("Storage error.", "error"); }
  }

  function notify(msg, type="success") {
    setNotification({msg, type});
    setTimeout(() => setNotification(null), 3500);
  }

  return (
    <div style={{minHeight:"100vh", background:C.darker, color:C.white, fontFamily:"'Barlow','Helvetica Neue',sans-serif"}}>
      <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet"/>

      {/* NAV */}
      <nav style={{position:"fixed",top:0,left:0,right:0,zIndex:200,background:"rgba(10,10,9,0.97)",backdropFilter:"blur(20px)",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 2rem",height:"58px"}}>
        <Logo width={130}/>
        <div style={{display:"flex",alignItems:"center",gap:"0.75rem"}}>
          <button style={{background:"none",border:"none",color:page==="listing"?C.gold:C.mid,fontSize:"0.78rem",letterSpacing:"0.08em",textTransform:"uppercase",cursor:"pointer",borderBottom:page==="listing"?`1px solid ${C.gold}`:"1px solid transparent",paddingBottom:"2px"}} onClick={()=>setPage("listing")}>Listing</button>
          <button style={{background:"none",border:"none",color:page==="manage"?C.gold:C.mid,fontSize:"0.78rem",letterSpacing:"0.08em",textTransform:"uppercase",cursor:"pointer",borderBottom:page==="manage"?`1px solid ${C.gold}`:"1px solid transparent",paddingBottom:"2px"}} onClick={()=>setPage("manage")}>
            Manage Photos {photos.length > 0 && <span style={{color:C.gold,fontSize:"0.68rem"}}>({photos.length})</span>}
          </button>
          <Btn style={{padding:"0.4rem 1rem",fontSize:"0.72rem"}} onClick={()=>setPage("manage")}>
            {photos.length === 0 ? "+ Upload Photos" : `${photos.length} Photos ✓`}
          </Btn>
        </div>
      </nav>

      {page === "listing"
        ? <ListingPage photos={photos} photosLoaded={photosLoaded} notify={notify}/>
        : <ManagePage photos={photos} savePhotos={savePhotos} notify={notify} onDone={()=>setPage("listing")}/>
      }

      {notification && (
        <div style={{position:"fixed",bottom:"2rem",right:"2rem",zIndex:500,background:notification.type==="error"?"rgba(200,126,126,0.12)":"rgba(200,169,110,0.1)",border:`1px solid ${notification.type==="error"?"rgba(200,126,126,0.4)":C.border}`,color:notification.type==="error"?"#C87E7E":C.gold,padding:"0.75rem 1.5rem",borderRadius:"2px",fontSize:"0.8rem",letterSpacing:"0.04em"}}>
          {notification.msg}
        </div>
      )}
    </div>
  );
}

function ManagePage({photos, savePhotos, notify, onDone}) {
  const [uploading, setUploading] = useState(false);
  const [progress, setProgress] = useState(0);
  const [dragOver, setDragOver] = useState(false);
  const [selected, setSelected] = useState(null);
  const [editCaption, setEditCaption] = useState(null);
  const [captionDraft, setCaptionDraft] = useState("");
  const [view, setView] = useState("grid");
  const [dragId, setDragId] = useState(null);
  const [dragOverId, setDragOverId] = useState(null);
  const fileRef = useRef(null);

  function onDragStart(e, id) {
    setDragId(id);
    e.dataTransfer.effectAllowed = "move";
  }
  function onDragEnter(id) { if (id !== dragId) setDragOverId(id); }
  async function onDropCard(e, targetId) {
    e.preventDefault();
    if (!dragId || dragId === targetId) { setDragId(null); setDragOverId(null); return; }
    const arr = [...photos];
    const fromIdx = arr.findIndex(p => p.id === dragId);
    const toIdx = arr.findIndex(p => p.id === targetId);
    const [moved] = arr.splice(fromIdx, 1);
    arr.splice(toIdx, 0, moved);
    setDragId(null); setDragOverId(null);
    await savePhotos(arr);
    notify("Order saved.");
  }
  function onDragEnd() { setDragId(null); setDragOverId(null); }

  async function processFiles(files) {
    if (!files?.length) return;
    setUploading(true); setProgress(0);
    const newPhotos = [];
    for (let i=0;i<files.length;i++) {
      const f = files[i];
      if (!f.type.startsWith("image/")) continue;
      try {
        const src = await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});
        newPhotos.push({id:`p_${Date.now()}_${i}`,src,caption:f.name.replace(/\.[^/.]+$/,"").replace(/[_-]/g," "),filename:f.name,size:f.size,uploadedAt:new Date().toISOString(),hero:photos.length===0&&i===0,order:photos.length+i});
        setProgress(Math.round(((i+1)/files.length)*100));
      } catch {}
    }
    const updated = [...photos,...newPhotos];
    await savePhotos(updated);
    setUploading(false); setProgress(0);
    notify(`${newPhotos.length} photo${newPhotos.length!==1?"s":""} uploaded.`);
  }

  async function deletePhoto(id) {
    await savePhotos(photos.filter(p=>p.id!==id));
    if (selected?.id===id) setSelected(null);
    notify("Photo deleted.");
  }

  async function setHero(id) {
    await savePhotos(photos.map(p=>({...p,hero:p.id===id})));
    notify("Hero photo set.");
  }

  async function move(id, dir) {
    const idx = photos.findIndex(p=>p.id===id);
    if (idx===-1) return;
    const nIdx = dir==="up"?idx-1:idx+1;
    if (nIdx<0||nIdx>=photos.length) return;
    const arr=[...photos];
    [arr[idx],arr[nIdx]]=[arr[nIdx],arr[idx]];
    await savePhotos(arr);
  }

  async function saveCaption(id) {
    await savePhotos(photos.map(p=>p.id===id?{...p,caption:captionDraft}:p));
    setEditCaption(null); notify("Caption saved.");
  }

  const fmt = b => b<1048576?(b/1024).toFixed(1)+"KB":(b/1048576).toFixed(1)+"MB";
  const totalSize = photos.reduce((s,p)=>s+(p.size||0),0);

  const s = {
    body: {maxWidth:"1200px",margin:"0 auto",padding:"2rem 2rem 4rem"},
    statsRow: {display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"1px",background:C.border,border:`1px solid ${C.border}`,marginBottom:"2rem"},
    statCell: {background:C.card,padding:"1rem 1.25rem"},
    drop: (over)=>({border:`2px dashed ${over?C.gold:"rgba(200,169,110,0.22)"}`,borderRadius:"3px",background:over?"rgba(200,169,110,0.05)":"rgba(255,255,255,0.02)",padding:"2.5rem 2rem",textAlign:"center",cursor:"pointer",transition:"all 0.2s",marginBottom:"1.5rem"}),
    grid: {display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(190px,1fr))",gap:"2px",background:C.borderFaint},
    gCard: (h)=>({background:C.card,cursor:"pointer",position:"relative",overflow:"hidden",outline:h?`2px solid ${C.gold}`:"none",outlineOffset:h?"-2px":"0"}),
    listRow: {display:"flex",alignItems:"center",gap:"1rem",padding:"0.7rem 1rem",border:`1px solid ${C.borderFaint}`,marginBottom:"2px",background:C.card,cursor:"pointer"},
    lightbox: {position:"fixed",inset:0,zIndex:500,background:"rgba(0,0,0,0.98)",display:"flex",flexDirection:"column"},
    lbTop: {display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0.75rem 1.5rem",borderBottom:`1px solid ${C.borderFaint}`,flexShrink:0},
    lbMain: {flex:1,display:"flex",overflow:"hidden"},
    lbImg: {flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"},

          <div key={l} style={s.statCell}>
            <div style={{fontSize:"0.62rem",color:C.dim,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:"0.2rem"}}>{l}</div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:"1.7rem",fontWeight:700,lineHeight:1,color:C.white}}>{v}</div>

      {photos.length > 0 && (
        <div style={{display:"flex",alignItems:"center",gap:"0.6rem",marginBottom:"1.25rem",flexWrap:"wrap"}}>
          <span style={{fontSize:"0.75rem",color:C.mid}}>{photos.length} photos</span>
          <Btn variant="ghost" style={{padding:"0.35rem 0.85rem",fontSize:"0.72rem",background:view==="grid"?"rgba(200,169,110,0.1)":"transparent",color:view==="grid"?C.gold:C.mid,border:view==="grid"?`1px solid ${C.border}`:`1px solid ${C.borderFaint}`}} onClick={()=>setView("grid")}>Grid</Btn>
          <Btn variant="ghost" style={{padding:"0.35rem 0.85rem",fontSize:"0.72rem",background:view==="list"?"rgba(200,169,110,0.1)":"transparent",color:view==="list"?C.gold:C.mid,border:view==="list"?`1px solid ${C.border}`:`1px solid ${C.borderFaint}`}} onClick={()=>setView("list")}>List</Btn>
          <div style={{flex:1}}/>
          <Btn variant="ghost" style={{padding:"0.35rem 0.85rem",fontSize:"0.72rem"}} onClick={()=>fileRef.current?.click()}>+ Add More</Btn>
          <Btn variant="danger" style={{padding:"0.35rem 0.85rem",fontSize:"0.72rem"}} onClick={async()=>{if(window.confirm("Delete all photos?")){{await savePhotos([]);notify("Cleared.");}}}}>Clear All</Btn>
          <Btn onClick={onDone} style={{padding:"0.4rem 1.1rem",fontSize:"0.78rem"}}>← Back to Listing</Btn>
        </div>
      )}

      {/* EMPTY */}
      {photos.length===0&&!uploading&&(
        <div style={{textAlign:"center",padding:"4rem 2rem",color:C.dim}}>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:"1.5rem",fontWeight:700,color:C.offwhite,marginBottom:"0.5rem"}}>No Photos Yet</div>
          <div style={{fontSize:"0.85rem"}}>Upload your Cherokee photos above to power the listing.</div>
        </div>
      )}

      {/* GRID — drag to reorder */}
      {photos.length>0&&view==="grid"&&(
        <>
          <div style={{fontSize:"0.72rem",color:C.dim,marginBottom:"0.75rem",letterSpacing:"0.04em"}}>
            ↕ Drag photos to reorder · exterior first, interior and engine last
          </div>
          <div style={s.grid}>
            {photos.map((p,idx)=>(
              <div
                key={p.id}
                draggable
                onDragStart={e=>onDragStart(e,p.id)}
                onDragEnter={()=>onDragEnter(p.id)}
                onDragOver={e=>e.preventDefault()}
                onDrop={e=>onDropCard(e,p.id)}
                onDragEnd={onDragEnd}
                onClick={()=>setSelected(p)}
                style={{
                  ...s.gCard(p.hero),
                  cursor:"grab",
                  opacity: dragId===p.id ? 0.35 : 1,
                  outline: dragOverId===p.id ? `2px solid ${C.gold}` : p.hero ? `2px solid ${C.gold}` : "none",
                  outlineOffset: "-2px",
                  transition:"opacity 0.15s",
                }}
              >
                <img src={p.src} alt={p.caption||""} style={{width:"100%",height:145,objectFit:"cover",display:"block",pointerEvents:"none"}}/>
                {p.hero&&<div style={{position:"absolute",top:6,left:6,background:C.gold,color:C.darker,fontSize:"0.58rem",fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",padding:"2px 7px",borderRadius:"1px"}}>Hero</div>}
                <div style={{position:"absolute",top:6,right:6,background:"rgba(10,10,9,0.75)",border:`1px solid ${C.border}`,color:C.dim,fontSize:"0.62rem",padding:"2px 7px",borderRadius:"1px",letterSpacing:"0.04em",pointerEvents:"none"}}>
                  #{idx+1}
                </div>
                <div style={{padding:"0.5rem 0.7rem"}}>
                  <div style={{fontSize:"0.76rem",color:C.offwhite,fontWeight:500,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.caption||"Untitled"}</div>
                  <div style={{fontSize:"0.65rem",color:C.dim,marginTop:"0.1rem"}}>{fmt(p.size||0)}</div>
                </div>
              </div>
            ))}
          </div>
        </>
      )}

      {/* LIST */}
      {photos.length>0&&view==="list"&&(
        <div>
          <div style={{fontSize:"0.72rem",color:C.dim,marginBottom:"0.75rem",letterSpacing:"0.04em"}}>↕ Drag rows to reorder</div>
          {photos.map((p,idx)=>(
            <div
              key={p.id}
              draggable
              onDragStart={e=>onDragStart(e,p.id)}
              onDragEnter={()=>onDragEnter(p.id)}
              onDragOver={e=>e.preventDefault()}
              onDrop={e=>onDropCard(e,p.id)}
              onDragEnd={onDragEnd}
              onClick={()=>setSelected(p)}
              style={{
                ...s.listRow,
                cursor:"grab",
                opacity: dragId===p.id ? 0.35 : 1,
                borderColor: dragOverId===p.id ? C.gold : "rgba(255,255,255,0.07)",
                transition:"opacity 0.15s, border-color 0.15s",
              }}
            >
              <span style={{fontSize:"0.75rem",color:C.dim,flexShrink:0,width:20,textAlign:"center"}}>⠿</span>
              <img src={p.src} alt="" style={{width:80,height:52,objectFit:"cover",flexShrink:0,pointerEvents:"none"}}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:"0.87rem",fontWeight:500,color:C.offwhite,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.caption||"Untitled"}</div>
                <div style={{fontSize:"0.7rem",color:C.dim,marginTop:"0.15rem"}}>{p.filename} · {fmt(p.size||0)}</div>
              </div>
              {p.hero&&<span style={{background:C.gold,color:C.darker,fontSize:"0.58rem",fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",padding:"2px 7px",borderRadius:"1px",flexShrink:0}}>Hero</span>}
              <span style={{fontSize:"0.7rem",color:C.dim,flexShrink:0}}>#{idx+1}</span>
            </div>
          ))}
        </div>
      )}

      {/* LIGHTBOX */}
      {selected&&(
        <div style={s.lightbox}>
          <div style={s.lbTop}>
            <Logo width={100}/>
            <span style={{fontSize:"0.75rem",color:C.mid}}>Photo {photos.findIndex(p=>p.id===selected.id)+1} of {photos.length}</span>
            <button style={{background:"none",border:`1px solid ${C.borderFaint}`,color:C.mid,padding:"0.3rem 0.85rem",cursor:"pointer",fontSize:"0.75rem",borderRadius:"2px"}} onClick={()=>setSelected(null)}>✕ Close</button>
          </div>
          <div style={s.lbMain}>
            <div style={s.lbImg}>
              <img src={selected.src} alt="" style={{maxHeight:"100%",maxWidth:"100%",objectFit:"contain"}}/>
            </div>
            <div style={s.lbPanel}>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:"1.1rem",fontWeight:700,letterSpacing:"0.04em",marginBottom:"1.25rem"}}>Photo Details</div>
              <div style={{fontSize:"0.62rem",color:C.dim,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:"0.3rem"}}>Caption</div>
              {editCaption===selected.id?(
                <div>
                  <input style={s.inp} value={captionDraft} onChange={e=>setCaptionDraft(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveCaption(selected.id)} autoFocus/>
                  <div style={{display:"flex",gap:"0.4rem",marginTop:"0.4rem"}}>
                    <Btn style={{padding:"0.3rem 0.85rem",fontSize:"0.72rem"}} onClick={()=>saveCaption(selected.id)}>Save</Btn>
                    <Btn variant="ghost" style={{padding:"0.3rem 0.75rem",fontSize:"0.72rem"}} onClick={()=>setEditCaption(null)}>Cancel</Btn>
                  </div>
                </div>
              ):(
                <div style={{display:"flex",alignItems:"center",gap:"0.5rem",marginBottom:"0.75rem"}}>
                  <span style={{fontSize:"0.85rem",color:C.offwhite,flex:1}}>{selected.caption||"Untitled"}</span>
                  <button style={{background:"transparent",border:`1px solid ${C.borderFaint}`,color:C.mid,padding:"2px 7px",fontSize:"0.68rem",cursor:"pointer",borderRadius:"1px"}} onClick={()=>{setEditCaption(selected.id);setCaptionDraft(selected.caption||"");}}>Edit</button>
                </div>
              )}
              {[["File",selected.filename],["Size",fmt(selected.size||0)],["Position",`#${photos.findIndex(p=>p.id===selected.id)+1} of ${photos.length}`]].map(([l,v])=>(
                <div key={l} style={{marginBottom:"0.6rem"}}>
                  <div style={{fontSize:"0.62rem",color:C.dim,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:"0.15rem"}}>{l}</div>
                  <div style={{fontSize:"0.83rem",color:C.offwhite}}>{v}</div>
                </div>
              ))}
              <div style={{marginTop:"1.5rem",display:"flex",flexDirection:"column",gap:"0.5rem"}}>
                {!selected.hero&&<Btn full onClick={()=>{setHero(selected.id);setSelected({...selected,hero:true});}}>★ Set as Hero</Btn>}
                {selected.hero&&<div style={{textAlign:"center",fontSize:"0.75rem",color:C.gold,padding:"0.5rem",border:`1px solid ${C.border}`}}>★ Current Hero Photo</div>}
                <Btn full variant="ghost" onClick={()=>move(selected.id,"up")}>↑ Move Up</Btn>
                <Btn full variant="ghost" onClick={()=>move(selected.id,"down")}>↓ Move Down</Btn>
                <Btn full variant="danger" onClick={()=>{deletePhoto(selected.id);setSelected(null);}}>✕ Delete</Btn>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
  </script>
</body>
</html>
